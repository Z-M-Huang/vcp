<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Buddy Configuration</title>
  <script
    src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"
    integrity="sha384-HZZ/fukV+9G8gwTNjN7zQDG0Sp7MsZy5DDN6VfY3Be7V9dvQpEpR2jF2HlyFUUjU"
    crossorigin="anonymous"
  ></script>
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
    integrity="sha384-9Ax3MmS9AClxJyd5/zafcXXjxmwFhZCdsT6HJoJjarvCaAkJlk5QDzjLJm+Wdx5F"
    crossorigin="anonymous"
  ></script>
  <script src="app.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body x-data="devBuddyApp()" x-init="init()">

  <header>
    <h1>Dev Buddy</h1>
    <p class="subtitle">AI Pipeline Configuration</p>
  </header>

  <nav>
    <button
      x-bind:class="{ active: tab === 'presets' }"
      x-on:click="tab = 'presets'; loadPresets()"
    >AI Presets</button>
    <button
      x-bind:class="{ active: tab === 'pipeline' }"
      x-on:click="tab = 'pipeline'; loadPipelineConfig()"
    >Pipeline Config</button>
    <button
      x-bind:class="{ active: tab === 'chatroom' }"
      x-on:click="tab = 'chatroom'; loadChatroomConfig()"
    >Chatroom</button>
  </nav>

  <!-- Error banner -->
  <div class="error-banner" x-show="errorMsg" x-text="errorMsg"></div>

  <!-- Success banner -->
  <div class="success-banner" x-show="successMsg" x-text="successMsg"></div>

  <!-- ============ AI Presets Tab ============ -->
  <section x-show="tab === 'presets'" class="tab-content">
    <div class="section-header">
      <h2>AI Presets</h2>
      <button class="btn-primary" x-on:click="showAddPreset = !showAddPreset">
        + Add Preset
      </button>
    </div>

    <!-- Add Preset Form -->
    <div class="card" x-show="showAddPreset">
      <h3 x-text="editingPresetKey ? 'Edit Preset: ' + editingPresetKey : 'Add New Preset'"></h3>
      <form x-on:submit.prevent="addPreset()">
        <template x-if="!editingPresetKey">
          <label>
            Preset Name (key)
            <input type="text" x-model="newPreset.key" placeholder="e.g. openrouter" required>
          </label>
        </template>
        <template x-if="editingPresetKey">
          <label>
            Preset Name (key)
            <input type="text" x-bind:value="editingPresetKey" disabled>
          </label>
        </template>
        <label>
          Display Name
          <input type="text" x-model="newPreset.name" placeholder="e.g. OpenRouter API" required>
        </label>
        <label>
          Type
          <select x-model="newPreset.type" x-bind:disabled="!!editingPresetKey">
            <option value="subscription">Subscription (Claude Task tool)</option>
            <option value="api">API (Direct API provider)</option>
            <option value="cli">CLI (Command-line tool)</option>
          </select>
        </label>
        <!-- API-specific fields -->
        <template x-if="newPreset.type === 'api'">
          <div>
            <label>
              API Format
              <select x-model="newPreset.protocol">
                <option value="anthropic">Anthropic (Claude API compatible)</option>
                <option value="openai">OpenAI (ChatGPT/Codex compatible)</option>
              </select>
            </label>
            <label x-show="newPreset.protocol === 'openai'" x-transition>
              Reasoning Effort <span class="optional-label">(optional, for reasoning models)</span>
              <select x-model="newPreset.reasoning_effort_api">
                <option value="">Not set (default)</option>
                <option value="minimal">Minimal</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="xhigh">Extra High</option>
              </select>
            </label>
            <label x-show="newPreset.protocol === 'openai'" x-transition>
              Max Output Tokens <span class="optional-label">(optional, default 16384)</span>
              <input type="number" x-model="newPreset.max_output_tokens" placeholder="16384" min="1" step="1">
            </label>
            <label>
              Base URL
              <input type="url" x-model="newPreset.base_url" placeholder="https://openrouter.ai/api" required>
            </label>
            <label>
              Provider Credential
              <input type="password" x-model="newPreset.api_key"
                x-bind:placeholder="newPreset.protocol === 'openai' ? 'Enter OpenAI-compatible API key' : 'Enter Anthropic-compatible API key'"
                required>
            </label>
            <label>
              Models (comma-separated)
              <input type="text" x-model="newPreset.models_str" placeholder="claude-sonnet-4-5-20250514,claude-opus-4-20250514">
            </label>
            <label>
              Task Timeout (minutes, optional)
              <input type="number" x-model="newPreset.timeout_minutes" placeholder="5" min="1" step="1">
            </label>
            <button type="button" class="btn-secondary btn-sm"
              x-on:click="testFormPreset()"
              x-bind:disabled="!canTestFormPreset()"
              x-bind:aria-label="'Test connectivity'"
            ><span x-text="formTesting ? 'Testing...' : 'Test Connectivity'"></span></button>
          </div>
        </template>

        <!-- CLI-specific fields -->
        <template x-if="newPreset.type === 'cli'">
          <div>
            <label>
              Command
              <input type="text" x-model="newPreset.command" placeholder="e.g. codex" required>
            </label>
            <label>
              Args Template
              <div class="placeholder-pills">
                <span class="pill">{model}</span>
                <span class="pill">{output_file}</span>
                <span class="pill">{schema_path}</span>
                <span class="pill">{prompt}</span>
                <span class="pill" x-show="newPreset.supports_reasoning_effort">{reasoning_effort}</span>
              </div>
              <input type="text" x-model="newPreset.args_template" placeholder="e.g. exec --full-auto -m {model} -o {output_file} --output-schema {schema_path} {prompt}" required>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" x-model="newPreset.supports_resume">
              Supports Resume
            </label>
            <label x-show="newPreset.supports_resume" x-transition>
              Resume Args Template
              <input type="text" x-model="newPreset.resume_args_template" placeholder="e.g. exec --full-auto -m {model} -o {output_file} --output-schema {schema_path} resume --last {prompt}">
            </label>
            <label>
              One-Shot Args Template <span class="optional-label">(for /dev-buddy-once)</span>
              <div class="placeholder-pills">
                <span class="pill">{model}</span>
                <span class="pill">{prompt}</span>
                <span class="pill" x-show="newPreset.supports_reasoning_effort">{reasoning_effort}</span>
              </div>
              <input type="text" x-model="newPreset.one_shot_args_template" placeholder="e.g. exec --full-auto -m {model} &quot;{prompt}&quot;">
            </label>
            <label class="checkbox-label">
              <input type="checkbox" x-model="newPreset.supports_reasoning_effort">
              Supports Reasoning Effort
            </label>
            <label x-show="newPreset.supports_reasoning_effort" x-transition>
              Default Reasoning Effort
              <select x-model="newPreset.reasoning_effort">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="xhigh">Extra High</option>
              </select>
            </label>
            <label>
              Timeout (minutes, optional)
              <input type="number" x-model="newPreset.timeout_minutes" placeholder="20" min="1" step="1">
            </label>
            <label>
              Models (comma-separated)
              <input type="text" x-model="newPreset.cli_models_str" placeholder="e.g. o3,o4-mini" required>
            </label>
            <button type="button" class="btn-secondary btn-sm"
              x-on:click="testFormPreset()"
              x-bind:disabled="!canTestFormPreset()"
              x-bind:aria-label="'Test command'"
            ><span x-text="formTesting ? 'Testing...' : 'Test Command'"></span></button>
          </div>
        </template>

        <!-- In-form test results -->
        <template x-if="formTestResults">
          <div class="test-result-panel" role="status" aria-live="polite">
            <button type="button" class="test-dismiss" x-on:click="formTestResults = null" aria-label="Dismiss test results">x</button>

            <!-- Error responses (429, validation, network) -->
            <template x-if="formTestResults.type === 'error'">
              <div class="test-summary test-error">
                <span x-text="formTestResults.message"></span>
              </div>
            </template>

            <!-- API results -->
            <template x-if="formTestResults.type === 'api'">
              <div>
                <div class="test-summary" x-bind:class="{
                  'test-success': formTestResults.results.every(r => r.success),
                  'test-error': formTestResults.results.every(r => !r.success),
                  'test-pending': formTestResults.results.some(r => r.success) && formTestResults.results.some(r => !r.success)
                }">
                  <span x-text="formTestResults.results.filter(r => r.success).length + ' of ' + formTestResults.results.length + ' models passed'"></span>
                </div>
                <template x-for="result in formTestResults.results" x-bind:key="result.model">
                  <div class="test-result-row">
                    <span class="test-model-name" x-text="result.model"></span>
                    <span class="test-badge" x-bind:class="result.success ? 'test-success' : 'test-error'" x-text="result.success ? 'Pass' : 'Fail'"></span>
                    <span class="test-latency" x-text="result.latency_ms + 'ms'"></span>
                    <span class="test-attempts" x-text="'attempt ' + result.attempts + '/3'"></span>
                    <span class="test-error-category" x-show="result.error_category" x-text="result.error_category"></span>
                  </div>
                </template>
                <template x-if="formTestResults.results.some(r => r.hint)">
                  <div class="test-hint">
                    <span x-text="formTestResults.results.find(r => r.hint)?.hint"></span>
                  </div>
                </template>
              </div>
            </template>

            <!-- CLI results -->
            <template x-if="formTestResults.type === 'cli'">
              <div>
                <template x-for="result in formTestResults.results" x-bind:key="result.command">
                  <div class="test-result-row">
                    <span class="test-model-name" x-text="result.command"></span>
                    <span class="test-badge" x-bind:class="result.found ? 'test-success' : 'test-error'" x-text="result.found ? 'Found' : 'Not Found'"></span>
                    <span class="test-latency" x-show="result.path" x-text="result.path"></span>
                  </div>
                </template>
              </div>
            </template>

            <!-- Subscription info -->
            <template x-if="formTestResults.type === 'subscription'">
              <div class="test-result-row test-info">
                <span x-text="formTestResults.message"></span>
              </div>
            </template>
          </div>
        </template>

        <div class="form-actions">
          <button type="submit" class="btn-primary" x-text="editingPresetKey ? 'Update Preset' : 'Add Preset'"></button>
          <button type="button" class="btn-secondary" x-on:click="showAddPreset = false; resetNewPreset()">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Presets list -->
    <div x-show="loading.presets" class="loading">Loading presets...</div>

    <template x-if="!loading.presets">
      <div>
        <template x-if="Object.keys(presets).length === 0">
          <p class="empty-state">No presets configured. Add one above.</p>
        </template>

        <template x-for="[name, preset] in Object.entries(presets)" x-bind:key="name">
          <div class="card preset-card">
            <div class="preset-header">
              <div>
                <span class="preset-name" x-text="name"></span>
                <span class="badge" x-bind:class="'badge-' + preset.type" x-text="preset.type"></span>
              </div>
              <div>
                <button
                  class="btn-secondary btn-sm"
                  x-show="editingPresetKey !== name"
                  x-on:click="testPreset(name)"
                  x-bind:disabled="testing[name]"
                  x-bind:aria-label="'Test connectivity for ' + name"
                ><span x-text="testing[name] ? 'Testing...' : 'Test'"></span></button>
                <button class="btn-secondary btn-sm" x-on:click="editPreset(name)">Edit</button>
                <button class="btn-danger btn-sm" x-on:click="deletePreset(name)">Remove</button>
              </div>
            </div>

            <div class="preset-details">
              <div x-text="preset.name" class="preset-display-name"></div>

              <!-- API preset details -->
              <template x-if="preset.type === 'api'">
                <div class="api-details">
                  <div class="detail-row">
                    <span class="label">API Format:</span>
                    <span x-text="preset.protocol === 'openai' ? 'OpenAI' : 'Anthropic'"></span>
                  </div>
                  <div class="detail-row">
                    <span class="label">Base URL:</span>
                    <span x-text="preset.base_url"></span>
                  </div>
                  <div class="detail-row">
                    <span class="label">Credential:</span>
                    <span x-text="revealedKeys[name] || preset.api_key"></span>
                    <button
                      class="btn-sm btn-secondary"
                      x-show="!revealedKeys[name]"
                      x-on:click="revealKey(name)"
                    >Reveal</button>
                    <button
                      class="btn-sm btn-secondary"
                      x-show="revealedKeys[name]"
                      x-on:click="hideKey(name)"
                    >Hide</button>
                  </div>
                  <div class="detail-row" x-show="preset.models && preset.models.length > 0">
                    <span class="label">Models:</span>
                    <span x-text="Array.isArray(preset.models) ? preset.models.join(', ') : ''"></span>
                  </div>
                  <div class="detail-row" x-show="preset.protocol === 'openai' && preset.max_output_tokens">
                    <span class="label">Max Output Tokens:</span>
                    <span x-text="preset.max_output_tokens"></span>
                  </div>
                </div>
              </template>

              <!-- CLI preset details -->
              <template x-if="preset.type === 'cli'">
                <div class="cli-details">
                  <div class="detail-row">
                    <span class="label">Command:</span>
                    <span x-text="preset.command"></span>
                  </div>
                  <div class="detail-row" x-show="preset.args_template">
                    <span class="label">Args Template:</span>
                    <span x-text="preset.args_template" class="code-text"></span>
                  </div>
                  <div class="detail-row" x-show="preset.supports_resume && preset.resume_args_template">
                    <span class="label">Resume Template:</span>
                    <span x-text="preset.resume_args_template" class="code-text"></span>
                  </div>
                  <div class="detail-row" x-show="preset.one_shot_args_template">
                    <span class="label">One-Shot Template:</span>
                    <span x-text="preset.one_shot_args_template" class="code-text"></span>
                  </div>
                  <div class="detail-row" x-show="preset.reasoning_effort">
                    <span class="label">Reasoning Effort:</span>
                    <span x-text="preset.reasoning_effort"></span>
                  </div>
                  <div class="detail-row" x-show="preset.timeout_ms">
                    <span class="label">Timeout:</span>
                    <span x-text="preset.timeout_ms ? Math.round(preset.timeout_ms / 60000) + ' min' : ''"></span>
                  </div>
                  <div class="detail-row" x-show="preset.models && preset.models.length > 0">
                    <span class="label">Models:</span>
                    <span x-text="Array.isArray(preset.models) ? preset.models.join(', ') : ''"></span>
                  </div>
                </div>
              </template>
            </div>

            <!-- Test result panel -->
            <div class="test-result-panel" x-show="testResults[name]" role="status" aria-live="polite">
              <button class="test-dismiss" x-on:click="dismissTest(name)" aria-label="Dismiss test results">x</button>

              <!-- API preset results -->
              <template x-if="testResults[name] && testResults[name].type === 'api'">
                <div>
                  <div class="test-summary"
                    x-bind:class="{
                      'test-success': testResults[name].results.filter(r => r.success).length === testResults[name].results.length,
                      'test-error': testResults[name].results.filter(r => r.success).length === 0,
                      'test-pending': testResults[name].results.filter(r => r.success).length > 0 && testResults[name].results.filter(r => r.success).length < testResults[name].results.length
                    }"
                  >
                    <span x-text="testResults[name].results.filter(r => r.success).length + ' of ' + testResults[name].results.length + ' models passed'"></span>
                  </div>
                  <template x-for="result in testResults[name].results" x-bind:key="result.model">
                    <div class="test-result-row">
                      <span class="test-model-name" x-text="result.model"></span>
                      <span class="test-badge" x-bind:class="result.success ? 'test-success' : 'test-error'" x-text="result.success ? 'Pass' : 'Fail'"></span>
                      <span class="test-latency" x-text="result.latency_ms + 'ms'"></span>
                      <span class="test-attempts" x-text="'attempt ' + result.attempts + '/3'"></span>
                      <span class="test-error-category" x-show="result.error_category" x-text="result.error_category"></span>
                    </div>
                  </template>
                  <template x-if="testResults[name].results.some(r => r.hint)">
                    <div class="test-hint">
                      <span x-text="testResults[name].results.find(r => r.hint)?.hint"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- CLI preset results -->
              <template x-if="testResults[name] && testResults[name].type === 'cli'">
                <div>
                  <template x-for="result in testResults[name].results" x-bind:key="result.command">
                    <div class="test-result-row">
                      <span class="test-model-name" x-text="result.command"></span>
                      <span class="test-badge" x-bind:class="result.found ? 'test-success' : 'test-error'" x-text="result.found ? 'Found' : 'Not Found'"></span>
                      <span class="test-latency" x-show="result.path" x-text="result.path"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Subscription preset results -->
              <template x-if="testResults[name] && testResults[name].type === 'subscription'">
                <div class="test-result-row test-info">
                  <span x-text="testResults[name].message"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>
  </section>

  <!-- ============ Pipeline Config Tab ============ -->
  <section x-show="tab === 'pipeline'" class="tab-content">
    <div class="section-header">
      <h2>Pipeline Configuration</h2>
      <button class="btn-primary" x-on:click="savePipelineConfig()" x-bind:disabled="saving.pipeline">
        <span x-text="saving.pipeline ? 'Saving...' : 'Save Config'"></span>
      </button>
    </div>

    <div x-show="loading.pipeline" class="loading">Loading pipeline config...</div>

    <template x-if="!loading.pipeline && pipelineConfig">
      <div>
        <!-- Pipeline sub-tabs -->
        <div class="pipeline-sub-tabs">
          <button
            x-bind:class="{ active: pipelineSubTab === 'feature' }"
            x-on:click="pipelineSubTab = 'feature'; $nextTick(() => { initSortable('feature-pipeline-list'); pipelineConfig.feature_pipeline.forEach((s, i) => { if (s.type === 'implementation' && Array.isArray(s.phased_reviews) && s.phased_reviews.length > 0) initPhasedReviewSortable('feature-phased-' + i, 'feature', i); }); })"
          >Feature Pipeline</button>
          <button
            x-bind:class="{ active: pipelineSubTab === 'bugfix' }"
            x-on:click="pipelineSubTab = 'bugfix'; $nextTick(() => { initSortable('bugfix-pipeline-list'); pipelineConfig.bugfix_pipeline.forEach((s, i) => { if (s.type === 'implementation' && Array.isArray(s.phased_reviews) && s.phased_reviews.length > 0) initPhasedReviewSortable('bugfix-phased-' + i, 'bugfix', i); }); })"
          >Bug-Fix Pipeline</button>
        </div>

        <!-- Feature Pipeline -->
        <div x-show="pipelineSubTab === 'feature'" class="card">
          <div class="pipeline-builder-header">
            <h3>Feature Pipeline</h3>
            <div class="pipeline-builder-actions">
              <button class="btn-secondary btn-sm" x-on:click="resetToDefault('feature')">Reset to Default</button>
            </div>
          </div>
          <p class="hint">Drag to reorder stages. Each stage uses a provider preset and optional model override.</p>

          <div id="feature-pipeline-list" class="pipeline-list">
            <template x-for="(stage, idx) in pipelineConfig.feature_pipeline" x-bind:key="stage._id">
              <div class="stage-card" x-bind:data-index="idx">
                <div class="drag-handle" title="Drag to reorder">
                  <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor">
                    <circle cx="4" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/>
                    <circle cx="4" cy="9" r="1.5"/><circle cx="8" cy="9" r="1.5"/>
                    <circle cx="4" cy="15" r="1.5"/><circle cx="8" cy="15" r="1.5"/>
                  </svg>
                </div>
                <div class="stage-info">
                  <span class="stage-type-badge" x-bind:class="'stage-type-' + stage.type.replace('-', '_')" x-text="stage.type"></span>
                </div>
                <div class="stage-controls">
                  <select
                    x-model="stage.provider"
                    x-init="$nextTick(() => $el.value = stage.provider || '')"
                    class="stage-select"
                    x-on:change="onProviderChange(stage)"
                  >
                    <template x-for="[presetName, preset] in Object.entries(presets)" x-bind:key="presetName">
                      <option x-bind:value="presetName" x-text="presetName + ' (' + preset.type + ')'"></option>
                    </template>
                  </select>
                  <label
                    class="parallel-checkbox"
                    x-show="stage.type === 'plan-review' || stage.type === 'code-review'"
                    title="Run in parallel with adjacent same-type stages"
                  >
                    <input type="checkbox" x-model="stage.parallel">
                    <span class="parallel-label">Parallel</span>
                  </label>
                  <label
                    class="parallel-checkbox review-gate-checkbox"
                    x-show="stage.type === 'requirements' || stage.type === 'planning'"
                    title="Pause pipeline after this stage for user approval"
                  >
                    <input type="checkbox" x-model="stage.review_gate">
                    <span class="parallel-label review-gate-label">Review Gate</span>
                  </label>
                  <select x-model="stage.model" x-init="$nextTick(() => $el.value = stage.model || '')" class="stage-select model-select" required>
                    <option value="" disabled>Select model</option>
                    <template x-for="m in (stageModelOptions[stage.provider] || [])" x-bind:key="m">
                      <option x-bind:value="m" x-text="m"></option>
                    </template>
                  </select>
                </div>
                <!-- Phased Reviews section (implementation stages only) -->
                <div class="phased-reviews-section" x-show="stage.type === 'implementation'">
                  <div class="phased-reviews-toggle" x-on:click="stage._phasedExpanded = !stage._phasedExpanded">
                    <span>Phased Reviews</span>
                    <span class="phased-reviews-badge"
                      x-bind:class="{'phased-reviews-badge-muted': !(stage.phased_reviews && stage.phased_reviews.length)}"
                      x-text="'(' + (stage.phased_reviews ? stage.phased_reviews.length : 0) + ')'"></span>
                    <span style="margin-left: auto; font-style: italic; opacity: 0.55; font-size: 0.72rem;">adjust frequency in Pipeline Settings ↓</span>
                  </div>
                  <div x-show="stage._phasedExpanded" x-transition>
                    <div x-bind:id="'feature-phased-' + idx" class="phased-reviews-list">
                      <template x-for="(pr, prIdx) in (stage.phased_reviews || [])" x-bind:key="pr._id">
                        <div class="phased-review-entry">
                          <div class="phased-drag-handle" title="Drag to reorder">
                            <svg width="8" height="14" viewBox="0 0 8 14" fill="currentColor">
                              <circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/>
                              <circle cx="2" cy="7" r="1.2"/><circle cx="6" cy="7" r="1.2"/>
                              <circle cx="2" cy="12" r="1.2"/><circle cx="6" cy="12" r="1.2"/>
                            </svg>
                          </div>
                          <select x-model="pr.provider" class="stage-select"
                            x-init="$nextTick(() => $el.value = pr.provider || '')"
                            x-on:change="onPhasedProviderChange('feature', idx, prIdx)">
                            <template x-for="[pName, pPreset] in Object.entries(presets)" x-bind:key="pName">
                              <option x-bind:value="pName" x-text="pName + ' (' + pPreset.type + ')'"></option>
                            </template>
                          </select>
                          <label class="parallel-checkbox" title="Run in parallel with adjacent phased reviewers">
                            <input type="checkbox" x-model="pr.parallel">
                            <span class="parallel-label">Parallel</span>
                          </label>
                          <select x-model="pr.model" x-init="$nextTick(() => $el.value = pr.model || '')" class="stage-select model-select" required>
                            <option value="" disabled>Select model</option>
                            <template x-for="m in (stageModelOptions[pr.provider] || [])" x-bind:key="m">
                              <option x-bind:value="m" x-text="m"></option>
                            </template>
                          </select>
                          <button class="stage-delete btn-danger btn-sm"
                            x-on:click="removePhasedReview('feature', idx, prIdx)">x</button>
                        </div>
                      </template>
                    </div>
                    <button class="btn-secondary btn-sm phased-reviews-add"
                      x-on:click="addPhasedReview('feature', idx)">+ Add Reviewer</button>
                  </div>
                </div>
                <button class="stage-delete btn-danger btn-sm" x-on:click="removeStage('feature', idx)" x-show="stage.type !== 'implementation'">x</button>
              </div>
            </template>
          </div>

          <!-- Add Stage -->
          <div class="add-stage-row">
            <select x-model="newStageType.feature" class="stage-select">
              <option value="">Select stage type to add...</option>
              <template x-for="st in getAvailableStageTypes('feature')" x-bind:key="st">
                <option x-bind:value="st" x-text="st"></option>
              </template>
            </select>
            <button
              class="btn-secondary btn-sm"
              x-on:click="addStage('feature', newStageType.feature)"
              x-bind:disabled="!newStageType.feature"
            >+ Add Stage</button>
          </div>
        </div>

        <!-- Bug-Fix Pipeline -->
        <div x-show="pipelineSubTab === 'bugfix'" class="card">
          <div class="pipeline-builder-header">
            <h3>Bug-Fix Pipeline</h3>
            <div class="pipeline-builder-actions">
              <button class="btn-secondary btn-sm" x-on:click="resetToDefault('bugfix')">Reset to Default</button>
            </div>
          </div>
          <p class="hint">Drag to reorder non-RCA stages. RCA stages are grouped; orchestrator consolidates after all RCA stages complete.</p>

          <!-- RCA Group Wrapper -->
          <div class="rca-group" x-show="pipelineConfig.bugfix_pipeline.some(s => s.type === 'rca')">
            <div class="rca-group-header">
              <span class="rca-group-title">RCA Stages</span>
              <label
                class="parallel-checkbox review-gate-checkbox"
                title="Pause pipeline after all RCA stages complete and consolidation runs, for user approval"
              >
                <input type="checkbox" x-model="pipelineConfig.rca_review_gate">
                <span class="parallel-label review-gate-label">Review Gate</span>
              </label>
            </div>
            <div class="rca-group-body">
              <template x-for="(stage, idx) in pipelineConfig.bugfix_pipeline" x-bind:key="'rca-' + stage._id">
                <div class="stage-card" x-show="stage.type === 'rca'">
                  <div class="stage-info">
                    <span class="stage-type-badge stage-type-rca">rca</span>
                  </div>
                  <div class="stage-controls">
                    <select
                      x-model="stage.provider"
                      x-init="$nextTick(() => $el.value = stage.provider || '')"
                      class="stage-select"
                      x-on:change="onProviderChange(stage)"
                    >
                      <template x-for="[presetName, preset] in Object.entries(presets)" x-bind:key="presetName">
                        <option x-bind:value="presetName" x-text="presetName + ' (' + preset.type + ')'"></option>
                      </template>
                    </select>
                    <label
                      class="parallel-checkbox"
                      title="Run in parallel with adjacent RCA stages"
                    >
                      <input type="checkbox" x-model="stage.parallel">
                      <span class="parallel-label">Parallel</span>
                    </label>
                    <select x-model="stage.model" x-init="$nextTick(() => $el.value = stage.model || '')" class="stage-select model-select" required>
                      <option value="" disabled>Select model</option>
                      <template x-for="m in (stageModelOptions[stage.provider] || [])" x-bind:key="m">
                        <option x-bind:value="m" x-text="m"></option>
                      </template>
                    </select>
                  </div>
                  <button class="stage-delete btn-danger btn-sm" x-on:click="removeStage('bugfix', idx)">x</button>
                </div>
              </template>
            </div>
            <div class="rca-group-add">
              <button class="btn-secondary btn-sm" x-on:click="addStage('bugfix', 'rca')">+ Add RCA</button>
            </div>
          </div>

          <!-- Non-RCA Pipeline Stages -->
          <div id="bugfix-pipeline-list" class="pipeline-list">
            <template x-for="(stage, idx) in pipelineConfig.bugfix_pipeline" x-bind:key="stage._id">
              <div class="stage-card" x-show="stage.type !== 'rca'" x-bind:data-index="idx">
                <div class="drag-handle" title="Drag to reorder">
                  <svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor">
                    <circle cx="4" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/>
                    <circle cx="4" cy="9" r="1.5"/><circle cx="8" cy="9" r="1.5"/>
                    <circle cx="4" cy="15" r="1.5"/><circle cx="8" cy="15" r="1.5"/>
                  </svg>
                </div>
                <div class="stage-info">
                  <span class="stage-type-badge" x-bind:class="'stage-type-' + stage.type.replace('-', '_')" x-text="stage.type"></span>
                </div>
                <div class="stage-controls">
                  <select
                    x-model="stage.provider"
                    x-init="$nextTick(() => $el.value = stage.provider || '')"
                    class="stage-select"
                    x-on:change="onProviderChange(stage)"
                  >
                    <template x-for="[presetName, preset] in Object.entries(presets)" x-bind:key="presetName">
                      <option x-bind:value="presetName" x-text="presetName + ' (' + preset.type + ')'"></option>
                    </template>
                  </select>
                  <label
                    class="parallel-checkbox"
                    x-show="stage.type === 'plan-review' || stage.type === 'code-review'"
                    title="Run in parallel with adjacent same-type stages"
                  >
                    <input type="checkbox" x-model="stage.parallel">
                    <span class="parallel-label">Parallel</span>
                  </label>
                  <select x-model="stage.model" x-init="$nextTick(() => $el.value = stage.model || '')" class="stage-select model-select" required>
                    <option value="" disabled>Select model</option>
                    <template x-for="m in (stageModelOptions[stage.provider] || [])" x-bind:key="m">
                      <option x-bind:value="m" x-text="m"></option>
                    </template>
                  </select>
                </div>
                <!-- Phased Reviews section (implementation stages only) -->
                <div class="phased-reviews-section" x-show="stage.type === 'implementation'">
                  <div class="phased-reviews-toggle" x-on:click="stage._phasedExpanded = !stage._phasedExpanded">
                    <span>Phased Reviews</span>
                    <span class="phased-reviews-badge"
                      x-bind:class="{'phased-reviews-badge-muted': !(stage.phased_reviews && stage.phased_reviews.length)}"
                      x-text="'(' + (stage.phased_reviews ? stage.phased_reviews.length : 0) + ')'"></span>
                    <span style="margin-left: auto; font-style: italic; opacity: 0.55; font-size: 0.72rem;">adjust frequency in Pipeline Settings ↓</span>
                  </div>
                  <div x-show="stage._phasedExpanded" x-transition>
                    <div x-bind:id="'bugfix-phased-' + idx" class="phased-reviews-list">
                      <template x-for="(pr, prIdx) in (stage.phased_reviews || [])" x-bind:key="pr._id">
                        <div class="phased-review-entry">
                          <div class="phased-drag-handle" title="Drag to reorder">
                            <svg width="8" height="14" viewBox="0 0 8 14" fill="currentColor">
                              <circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/>
                              <circle cx="2" cy="7" r="1.2"/><circle cx="6" cy="7" r="1.2"/>
                              <circle cx="2" cy="12" r="1.2"/><circle cx="6" cy="12" r="1.2"/>
                            </svg>
                          </div>
                          <select x-model="pr.provider" class="stage-select"
                            x-init="$nextTick(() => $el.value = pr.provider || '')"
                            x-on:change="onPhasedProviderChange('bugfix', idx, prIdx)">
                            <template x-for="[pName, pPreset] in Object.entries(presets)" x-bind:key="pName">
                              <option x-bind:value="pName" x-text="pName + ' (' + pPreset.type + ')'"></option>
                            </template>
                          </select>
                          <label class="parallel-checkbox" title="Run in parallel with adjacent phased reviewers">
                            <input type="checkbox" x-model="pr.parallel">
                            <span class="parallel-label">Parallel</span>
                          </label>
                          <select x-model="pr.model" x-init="$nextTick(() => $el.value = pr.model || '')" class="stage-select model-select" required>
                            <option value="" disabled>Select model</option>
                            <template x-for="m in (stageModelOptions[pr.provider] || [])" x-bind:key="m">
                              <option x-bind:value="m" x-text="m"></option>
                            </template>
                          </select>
                          <button class="stage-delete btn-danger btn-sm"
                            x-on:click="removePhasedReview('bugfix', idx, prIdx)">x</button>
                        </div>
                      </template>
                    </div>
                    <button class="btn-secondary btn-sm phased-reviews-add"
                      x-on:click="addPhasedReview('bugfix', idx)">+ Add Reviewer</button>
                  </div>
                </div>
                <button class="stage-delete btn-danger btn-sm" x-on:click="removeStage('bugfix', idx)" x-show="stage.type !== 'implementation'">x</button>
              </div>
            </template>
          </div>

          <!-- Add Stage (non-RCA) -->
          <div class="add-stage-row">
            <select x-model="newStageType.bugfix" class="stage-select">
              <option value="">Select stage type to add...</option>
              <template x-for="st in getAvailableStageTypes('bugfix').filter(t => t !== 'rca')" x-bind:key="st">
                <option x-bind:value="st" x-text="st"></option>
              </template>
            </select>
            <button
              class="btn-secondary btn-sm"
              x-on:click="addStage('bugfix', newStageType.bugfix)"
              x-bind:disabled="!newStageType.bugfix"
            >+ Add Stage</button>
          </div>
        </div>

        <!-- Pipeline Settings -->
        <div class="card">
          <h3>Pipeline Settings</h3>
          <form x-on:submit.prevent>
            <label>
              Max Iterations per Reviewer
              <input type="number" min="1" max="50" x-model.number="pipelineConfig.max_iterations">
            </label>
            <label>
              Max Phased Review Iterations per Step
              <input type="number" min="1" max="20" x-model.number="pipelineConfig.max_phased_iterations" placeholder="3">
            </label>
            <label>
              Review Interval (steps per batch)
              <input type="number" min="1" max="50" x-model.number="pipelineConfig.review_interval" placeholder="1">
            </label>
            <label>
              Team Name Pattern
              <input type="text" x-model="pipelineConfig.team_name_pattern">
            </label>
          </form>
        </div>
      </div>
    </template>
  </section>

  <!-- ============ Chatroom Tab ============ -->
  <section x-show="tab === 'chatroom'" class="tab-content">
    <div class="section-header">
      <h2>PK Stage Chatroom</h2>
    </div>

    <p class="hint">
      Configure participants for the multi-AI competitive debate (<code>/dev-buddy-chatroom</code>).
      Each participant uses a preset and model from your AI Presets.
    </p>

    <!-- Loading state -->
    <template x-if="loading.chatroom">
      <p class="loading">Loading chatroom config...</p>
    </template>

    <!-- Chatroom config form -->
    <template x-if="!loading.chatroom && chatroomConfig">
      <div>
        <div class="card">
          <h3>Participants</h3>

          <!-- Empty state -->
          <template x-if="chatroomConfig.participants.length === 0">
            <p class="empty-state">No participants configured. Add at least one to use the chatroom.</p>
          </template>

          <!-- Participant list -->
          <template x-for="(participant, index) in chatroomConfig.participants" x-bind:key="index">
            <div class="stage-card">
              <div class="stage-info">
                <span class="stage-type-badge" x-text="'P' + index" style="background: #e8f5e9; color: #2e7d32;"></span>
              </div>
              <div class="stage-controls">
                <select
                  class="stage-select"
                  x-model="participant.preset"
                  x-on:change="onParticipantProviderChange(index)"
                  x-init="$nextTick(() => $el.value = participant.preset || '')"
                >
                  <option value="" disabled>Select preset...</option>
                  <template x-for="[presetName, preset] in Object.entries(presets)" x-bind:key="presetName">
                    <option x-bind:value="presetName" x-text="presetName + ' (' + preset.type + ')'"></option>
                  </template>
                </select>
                <select
                  class="stage-select model-select"
                  x-model="participant.model"
                  x-init="$nextTick(() => $el.value = participant.model || '')"
                >
                  <option value="" disabled>Select model...</option>
                  <template x-for="m in (stageModelOptions[participant.preset] || [])" x-bind:key="m">
                    <option x-bind:value="m" x-text="m"></option>
                  </template>
                </select>
              </div>
              <button class="btn-danger btn-sm stage-delete" x-on:click="removeParticipant(index)">Remove</button>
            </div>
          </template>

          <!-- Add participant -->
          <div style="margin-top: 12px;">
            <button
              class="btn-secondary btn-sm"
              x-on:click="addParticipant()"
              x-bind:disabled="chatroomConfig.participants.length >= 10"
            >+ Add Participant</button>
            <span x-show="chatroomConfig.participants.length >= 10" style="color: #6e6e73; font-size: 0.8rem; margin-left: 8px;">
              Maximum 10 participants
            </span>
          </div>
        </div>

        <!-- Settings card -->
        <div class="card">
          <h3>Settings</h3>
          <form x-on:submit.prevent>
            <label>
              Max Rounds (1–10)
              <input
                type="number"
                min="1"
                max="10"
                x-model.number="chatroomConfig.max_rounds"
              >
            </label>
          </form>
        </div>

        <!-- Actions -->
        <div class="form-actions" style="margin-top: 16px;">
          <button
            class="btn-primary"
            x-on:click="saveChatroomConfig()"
            x-bind:disabled="saving.chatroom"
            x-text="saving.chatroom ? 'Saving...' : 'Save Chatroom Config'"
          ></button>
          <button
            class="btn-secondary"
            x-on:click="resetChatroomToDefault()"
          >Reset to Default</button>
        </div>
      </div>
    </template>
  </section>


</body>
</html>
